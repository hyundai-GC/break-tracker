<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴식 기록 시스템</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; text-align: center; padding: 40px 20px; background-color: #f8f9fa; }
    h2 { color: #333; margin-bottom: 30px; }
    .form-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: inline-block; width: 100%; max-width: 350px; text-align: left; box-sizing: border-box; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    select, input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background-color: #2b6cb0; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:active { background-color: #2c5282; }
  </style>
</head>
<body>
 
  <h2>휴식 기록 시스템</h2>
 
  <div class="form-box">
    <label for="company">협력회사</label>
    <select id="company">
      <option value="청연">청연</option>
      <option value="현대">현대</option>
    </select>
 
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="이름을 입력하세요">
 
    <button onclick="sendData()">휴식 기록하기</button>
  </div>
 
  <script>
    // 
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyrYZB8_cwEwS_U7bX4b5KIHpZiG-L-3yiP5E0oyCGQj2dNrsoi09_T0NfYvGHEVgRb/exec';
 
    function sendData() {
      const company = document.getElementById('company').value;
      const name = document.getElementById('name').value.trim();
 
      if (!name) {
        alert('이름을 입력해주세요!');
        return;
      }
 
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: company, name: name })
      })
      .then(() => {
        alert('기록되었습니다!');
        document.getElementById('name').value = '';
      })
      .catch(error => {
        alert('오류가 발생했습니다.');
        console.error('Error:', error);
      });
    }
  </script>
 
</body>
</html>
